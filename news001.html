<!doctype html>
<html lang="ja">

<head>

    <!-- =========================
         BASIC SETTINGS
    ========================== -->

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- =========================
         SEO
    ========================== -->

    <title>公式サイトを公開しました。｜TCQ</title>

    <meta name="description"
          content="東京都市大学クイズ研究会 TCQの公式サイト公開のお知らせです。">

    <meta name="author"
          content="東京都市大学クイズ研究会 TCQ">

    <meta name="robots"
          content="index, follow">


    <!-- =========================
         Google Fonts
    ========================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
          rel="stylesheet">


    <!-- =========================
         CSS
    ========================== -->

    <link rel="stylesheet"
          href="style.css">


    <!-- =========================
         NEWS DETAIL CSS
    ========================== -->

    <style>

        /* =================================
           NEWS DETAIL PAGE
        ================================= */

        .news-detail-page {
            min-height: 100vh;
            background-color: #f3f5f7;
        }


        /* =================================
           HEADER
        ================================= */

        .news-detail-header {
            padding: 70px 30px;

            background-color: #111827;

            color: white;
        }


        .news-detail-header-inner {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;
        }


        .news-detail-label {
            margin: 0 0 15px;

            color: #66c7ff;

            font-size: 13px;
            font-weight: 900;

            letter-spacing: 4px;
        }


        .news-detail-date {
            margin: 0 0 20px;

            color: rgba(255,255,255,0.6);

            font-size: 13px;

            letter-spacing: 1px;
        }


        .news-detail-header h1 {
            margin: 0;

            font-size: 42px;

            line-height: 1.5;

            font-weight: 900;
        }


        /* =================================
           CONTENT
        ================================= */

        .news-detail-content {
            width: 100%;
            max-width: 900px;

            margin: 70px auto 0;

            padding: 0 30px 100px;

            box-sizing: border-box;
        }


        /* =================================
           ARTICLE
        ================================= */

        .news-detail-box {
            padding: 50px;

            background-color: #ffffff;

            box-sizing: border-box;
        }


        .news-detail-box p {
            margin: 0 0 25px;

            color: #172033;

            font-size: 16px;

            line-height: 2;
        }


        .news-detail-box p:last-child {
            margin-bottom: 0;
        }


        /* =================================
           BACK BUTTON
        ================================= */

        .news-detail-back {
            display: inline-block;

            margin-top: 45px;

            color: #0071bc;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 1px;
        }


        .news-detail-back:hover {
            text-decoration: underline;
        }


        /* =================================
           FOOTER
        ================================= */

        .news-detail-footer {
            padding: 35px 30px;

            background-color: #0b1220;

            color: white;

            text-align: center;
        }


        .news-detail-footer p {
            margin: 0 0 5px;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 3px;
        }


        .news-detail-footer span {
            color: rgba(255,255,255,0.5);

            font-size: 10px;

            letter-spacing: 2px;
        }


        /* =================================
           MOBILE
        ================================= */

        @media screen and (max-width: 600px) {


            .news-detail-header {
                padding: 55px 20px;
            }


            .news-detail-header h1 {
                font-size: 30px;
            }


            .news-detail-content {
                margin-top: 40px;

                padding: 0 15px 70px;
            }


            .news-detail-box {
                padding: 30px 25px;
            }


            .news-detail-box p {
                font-size: 14px;

                line-height: 1.9;
            }


        }

    </style>

</head>


<body>


    <!-- =========================
         NEWS DETAIL
    ========================== -->

    <main class="news-detail-page">


        <!-- =========================
             ARTICLE HEADER
        ========================== -->

        <header class="news-detail-header">

            <div class="news-detail-header-inner">


                <p class="news-detail-label">
                    NEWS
                </p>


                <p class="news-detail-date">
                    2026.09.29
                </p>


                <h1>
                    公式サイトを公開しました。
                </h1>


            </div>

        </header>



        <!-- =========================
             ARTICLE CONTENT
        ========================== -->

        <div class="news-detail-content">


            <article class="news-detail-box">


                <p>
                    東京都市大学クイズ研究会「TCQ」の
                    公式サイトを公開しました。
                </p>


                <p>
                    TCQでは、クイズを通して知識を深めながら、
                    メンバー同士で楽しく活動しています。
                </p>


                <p>
                    今後はこちらの公式サイトを通して、
                    活動内容やイベント、最新のお知らせなどを
                    発信していきます。
                </p>


                <p>
                    東京都市大学の学生で、
                    クイズに興味のある方はぜひチェックしてください。
                </p>


            </article>



            <!-- =========================
                 BACK TO NEWS
            ========================== -->

            <a href="news.html"
               class="news-detail-back">

                ← NEWS一覧に戻る

            </a>


        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="news-detail-footer">

        <p>
            TCQ
        </p>

        <span>
            TOKYO CITY UNIVERSITY QUIZ CLUB
        </span>

    </footer>


</body>

</html>
